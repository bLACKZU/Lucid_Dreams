grafana:
  adminPassword: admin

  ingress:
    enabled: true
    ingressClassName: alb
    hosts: [] 
    path: /
    pathType: Prefix
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/healthcheck-path: /api/health

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

prometheus:
  ingress:
    enabled: true
    ingressClassName: alb
    hosts: []
    paths: ["/"]
    pathType: Prefix
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/healthcheck-path: /-/healthy

  prometheusSpec:
    retention: 6h
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        memory: 900Mi

alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 96Mi
