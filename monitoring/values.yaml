grafana:
  adminPassword: admin

  ingress:
    enabled: true
    ingressClassName: alb
    hosts: [] 
    path: /
    pathType: Prefix
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/healthcheck-path: /api/health

  # Grafana sits around 250Mi once the bundled dashboards are loaded. A 256Mi
  # limit left it GC-thrashing at the ceiling, too slow to answer its own
  # health probe, so it kept dropping out of the ALB target group with 503s.
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi

prometheus:
  ingress:
    enabled: true
    ingressClassName: alb
    hosts: []
    paths: ["/"]
    pathType: Prefix
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/healthcheck-path: /-/healthy

  prometheusSpec:
    retention: 6h
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        memory: 900Mi

alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 96Mi
