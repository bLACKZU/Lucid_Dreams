name: Build and Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "Dockerfile"
      - "charts/**"
      - ".github/workflows/deploy.yml"

env:
  AWS_REGION: us-east-1
  CLUSTER_PREFIX: hello-world # matches var.cluster_name in infra/
  APP: hello-world # Helm release name and namespace
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/hello-world:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # The SHA tag is what gets deployed. :latest exists so the chart's
          # default works for a standalone `helm install`.
          tags: |
            ${{ env.IMAGE }}
            ${{ secrets.DOCKERHUB_USERNAME }}/hello-world:latest

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: azure/setup-kubectl@v4

      - uses: azure/setup-helm@v4

      # The cluster name carries a random suffix from Terraform, so look it
      # up by prefix instead of hardcoding it.
      - name: Connect to EKS
        run: |
          CLUSTER=$(aws eks list-clusters \
            --query "clusters[?starts_with(@, '$CLUSTER_PREFIX')] | [0]" --output text)

          if [ -z "$CLUSTER" ] || [ "$CLUSTER" = "None" ]; then
            echo "*error*No EKS cluster starting with '$CLUSTER_PREFIX' in $AWS_REGION. Run terraform apply first."
            exit 1
          fi

          aws eks update-kubeconfig --name "$CLUSTER"

          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          VPC=$(aws eks describe-cluster --name "$CLUSTER" \
            --query 'cluster.resourcesVpcConfig.vpcId' --output text)

          echo "CLUSTER=$CLUSTER" >> "$GITHUB_ENV"
          echo "VPC=$VPC" >> "$GITHUB_ENV"
          echo "LB_ROLE_ARN=arn:aws:iam::$ACCOUNT:role/$CLUSTER-lb-controller" >> "$GITHUB_ENV"

      - name: Install AWS Load Balancer Controller
        run: |
          if helm status aws-load-balancer-controller -n kube-system >/dev/null 2>&1; then
            echo "Already installed - skipping."
            exit 0
          fi

          helm repo add eks https://aws.github.io/eks-charts
          helm repo update

          helm install aws-load-balancer-controller eks/aws-load-balancer-controller \
            --namespace kube-system \
            --set clusterName="$CLUSTER" \
            --set region="$AWS_REGION" \
            --set vpcId="$VPC" \
            --set serviceAccount.name=aws-load-balancer-controller \
            --set-string serviceAccount.annotations."eks\.amazonaws\.com/role-arn"="$LB_ROLE_ARN" \
            --wait --timeout 10m

      - name: Deploy hello-world
        run: |
          helm upgrade --install "$APP" ./charts/hello-world \
            --namespace "$APP" --create-namespace \
            --set image.repository="${{ secrets.DOCKERHUB_USERNAME }}/hello-world" \
            --set image.tag="${{ github.sha }}" \
            --wait --timeout 5m

      - name: Install monitoring
        run: |
          if helm status monitoring -n monitoring >/dev/null 2>&1; then
            echo "Already installed - skipping."
            exit 0
          fi

          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update

          helm install monitoring prometheus-community/kube-prometheus-stack \
            --namespace monitoring --create-namespace \
            -f monitoring/values.yaml \
            --set grafana.adminPassword="${{ secrets.GRAFANA_ADMIN_PASSWORD || 'admin' }}" \
            --wait --timeout 15m

      - name: Report URLs
        run: |
          # Polls an Ingress until the ALB publishes its hostname.
          wait_for_address() {
            local addr=""
            for _ in $(seq 60); do
              addr=$(kubectl get ingress "$1" -n "$2" \
                -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
              if [ -n "$addr" ]; then break; fi
              sleep 5
            done
            echo "$addr"
          }

          APP_ADDR=$(wait_for_address "$APP" "$APP")

          if [ -z "$APP_ADDR" ]; then
            echo "::error::Ingress never got an address - the load balancer controller could not provision the ALB."
            kubectl describe ingress "$APP" -n "$APP"
            kubectl logs -n kube-system -l app.kubernetes.io/name=aws-load-balancer-controller --tail=30
            exit 1
          fi

          APP_URL="http://$APP_ADDR"

          # The ALB 5xx's until its target group passes its first health
          # checks, so confirm it really serves before calling this a success.
          for _ in $(seq 60); do
            BODY=$(curl -fsS --max-time 5 "$APP_URL" 2>/dev/null || true)
            if [ "$BODY" = "Hello World" ]; then break; fi
            sleep 5
          done

          if [ "$BODY" != "Hello World" ]; then
            echo "::error::$APP_URL did not return \"Hello World\" (last response: '${BODY:-no response}')."
            exit 1
          fi

          GRAFANA_ADDR=$(wait_for_address monitoring-grafana monitoring)
          PROM_ADDR=$(wait_for_address monitoring-kube-prometheus-prometheus monitoring)

          {
            echo "## Deployed"
            echo ""
            echo "| Service | URL |"
            echo "|---|---|"
            echo "| Hello World | http://$APP_ADDR |"
            if [ -n "$GRAFANA_ADDR" ]; then echo "| Grafana | http://$GRAFANA_ADDR |"; fi
            if [ -n "$PROM_ADDR" ]; then echo "| Prometheus | http://$PROM_ADDR |"; fi
            echo ""
            echo "Grafana login: \`admin\` / value of the \`GRAFANA_ADMIN_PASSWORD\` secret (\`admin\` if unset)."
            echo "Dashboards: **Dashboards -> General** has the pre-built Kubernetes cluster, node and pod views."
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Cluster | \`$CLUSTER\` |"
            echo "| Image | \`$IMAGE\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "App:        $APP_URL"
          echo "Grafana:    http://${GRAFANA_ADDR:-not-ready}"
          echo "Prometheus: http://${PROM_ADDR:-not-ready}"
