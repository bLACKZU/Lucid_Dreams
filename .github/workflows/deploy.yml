name: Build and Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "Dockerfile"
      - "charts/**"
      - ".github/workflows/deploy.yml"

env:
  AWS_REGION: us-east-1
  CLUSTER_PREFIX: hello-world # matches var.cluster_name in infra/
  APP: hello-world # Helm release name and namespace
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/hello-world:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: azure/setup-kubectl@v4

      - uses: azure/setup-helm@v4

      # The cluster name carries a random suffix from Terraform, so look it
      # up by prefix instead of hardcoding it.
      - name: Connect to EKS
        run: |
          CLUSTER=$(aws eks list-clusters \
            --query "clusters[?starts_with(@, '$CLUSTER_PREFIX')] | [0]" --output text)

          if [ -z "$CLUSTER" ] || [ "$CLUSTER" = "None" ]; then
            echo "::error::No EKS cluster starting with '$CLUSTER_PREFIX' in $AWS_REGION. Run terraform apply first."
            exit 1
          fi

          aws eks update-kubeconfig --name "$CLUSTER"

          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          VPC=$(aws eks describe-cluster --name "$CLUSTER" \
            --query 'cluster.resourcesVpcConfig.vpcId' --output text)

          echo "CLUSTER=$CLUSTER" >> "$GITHUB_ENV"
          echo "VPC=$VPC" >> "$GITHUB_ENV"
          echo "LB_ROLE_ARN=arn:aws:iam::$ACCOUNT:role/$CLUSTER-lb-controller" >> "$GITHUB_ENV"

      # Service account name/namespace must match the IRSA trust policy in
      # infra/main.tf (kube-system:aws-load-balancer-controller).
      - name: Install AWS Load Balancer Controller
        run: |
          helm repo add eks https://aws.github.io/eks-charts
          helm repo update

          helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
            --namespace kube-system \
            --set clusterName="$CLUSTER" \
            --set region="$AWS_REGION" \
            --set vpcId="$VPC" \
            --set serviceAccount.name=aws-load-balancer-controller \
            --set-string serviceAccount.annotations."eks\.amazonaws\.com/role-arn"="$LB_ROLE_ARN" \
            --wait --timeout 10m

      - name: Deploy hello-world
        run: |
          helm upgrade --install "$APP" ./charts/hello-world \
            --namespace "$APP" --create-namespace \
            --set image.repository="${{ secrets.DOCKERHUB_USERNAME }}/hello-world" \
            --set image.tag="${{ github.sha }}" \
            --wait --timeout 5m

      - name: Print URL
        run: |
          for _ in $(seq 60); do
            ADDRESS=$(kubectl get ingress "$APP" -n "$APP" \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            if [ -n "$ADDRESS" ]; then break; fi
            sleep 10
          done

          if [ -z "$ADDRESS" ]; then
            echo "::warning::ALB address not published yet."
            kubectl describe ingress "$APP" -n "$APP"
            exit 0
          fi

          echo "URL: http://$ADDRESS" | tee -a "$GITHUB_STEP_SUMMARY"
