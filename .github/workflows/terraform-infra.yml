name: Terraform Infra

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        type: choice
        required: true
        default: plan
        options:
          - plan
          - apply
          - destroy

permissions:
  id-token: write # required for OIDC federation to AWS
  contents: read

jobs:
  terraform:
    name: terraform-${{ inputs.action }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    env:
      TF_VAR_github_org: ${{ github.repository_owner }}
      TF_VAR_github_repo: ${{ github.event.repository.name }}
      TF_VAR_tf_state_bucket: ${{ vars.TF_STATE_BUCKET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC, no stored access keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ vars.TF_STATE_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="region=${{ vars.TF_STATE_REGION }}"

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        if: inputs.action == 'plan'
        run: terraform plan -input=false -no-color

      - name: Terraform Apply
        if: inputs.action == 'apply'
        run: terraform apply -input=false -auto-approve -no-color

      - name: Terraform Destroy
        if: inputs.action == 'destroy'
        run: terraform destroy -input=false -auto-approve -no-color
